minimum_pre_commit_version: '4.7.0'
repos:
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        exclude: ^(gas_detector/dev/|\.private/|\.tmp/)
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        exclude: ^(gas_detector/dev/|\.private/|\.tmp/)
