<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#214e42">
  <meta name="description" content="내 하루의 일과 물품, 기록을 연결하는 로컬 업무 콘솔 WHOIAM.">
  <title>WHOIAM — 나의 업무 콘솔</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./report.css">
  <link rel="stylesheet" href="./functional.css">
</head>
<body>
  <div class="app-frame">
    <div class="app-shell">
      <aside class="sidebar" aria-label="주 메뉴">
        <a class="brand" href="#home" aria-label="WHOIAM 홈"><span class="brand-mark"><i></i><i></i><i></i></span><span>whoiam<span class="brand-period">.</span></span></a>
        <div class="workspace-label">MY WORKSPACE <span>01</span></div>
        <nav class="main-nav" id="desktop-nav"></nav>
        <div class="sidebar-bottom">
          <div class="node-card"><span class="node-dot"></span><div><strong>나의 작업 공간</strong><span>하루의 흐름을 연결합니다</span></div></div>
          <div class="sidebar-foot"><span>WHOIAM CONSOLE</span><span>v0.04</span></div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb"><span class="small-brand">whoiam.</span><span class="desktop-only">내 작업 공간</span><span class="crumb-divider">/</span><strong id="breadcrumb-current">홈</strong></div>
          <div class="topbar-actions"><span class="device-status"><span class="node-dot"></span>로컬 장치</span><button class="icon-button view-toggle" id="view-toggle" aria-label="작은 화면으로 보기" title="작은 화면으로 보기"></button><span class="avatar" aria-label="내 프로필">W</span></div>
        </header>
        <main id="main-content" tabindex="-1"></main>
        <footer class="workspace-footer"><span><span class="tiny-dot"></span>로컬 작업 공간에 연결 중</span><span>작은 일부터, 차곡차곡.</span></footer>
      </div>
      <nav class="bottom-nav" id="mobile-nav" aria-label="하단 주 메뉴"></nav>
    </div>
  </div>
  <dialog id="flow-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./report.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
